[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mealplanner"
version = "0.1.0"
description = "Weekly meal planning logic (used both in tests and in-browser via Pyodide)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mealplanner = "mealplanner.cli:main"

[tool.setuptools]
packages = ["mealplanner"]
